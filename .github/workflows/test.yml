name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node --test

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --tag negev-user-test:ci .
      - run: |
          docker run --detach --name negev-user-ci --network none \
            --tmpfs /data:rw,mode=0700,uid=1000,gid=1000 \
            --env NEGEV_USER_SERVER=1 \
            --env NEGEV_SHOKO_URL=http://shoko.invalid:8111 \
            --env NEGEV_SHOKO_API_KEY_FILE=/data/secrets/shoko.token \
            --env NEGEV_DATA_DIR=/data \
            --env NEGEV_PUBLIC_ORIGIN=http://localhost:3000 \
            --env NEGEV_ADMIN_USERNAME=Owner \
            --entrypoint sh negev-user-test:ci \
            -c 'printf "synthetic-test-password\n" | node src/auth/init-admin.mjs && install -d -m 0700 /data/secrets && printf synthetic-key > /data/secrets/shoko.token && chmod 0600 /data/secrets/shoko.token && node src/web/user-server.mjs'
          for attempt in 1 2 3 4 5; do
            if docker exec negev-user-ci node -e "fetch('http://127.0.0.1:3000/health/live').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"; then
              docker exec -i negev-user-ci node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:3000';
          const origin = 'http://localhost:3000';
          const anonymous = await fetch(`${base}/api/requests`);
          if (anonymous.status !== 401) throw new Error('Private requests are exposed');
          const login = await fetch(`${base}/api/login`, {
            method: 'POST', headers: { Origin: origin,
              'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'Owner',
              password: 'synthetic-test-password' }),
          });
          if (login.status !== 200) throw new Error('Image login failed');
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          if (!cookie) throw new Error('Image session cookie missing');
          const session = await fetch(`${base}/api/session`, {
            headers: { Cookie: cookie },
          });
          const account = await session.json();
          if (session.status !== 200 || account.user?.role !== 'admin' ||
              !account.csrfToken || account.capabilities?.releaseSearch ||
              account.capabilities?.availabilityChecks) {
            throw new Error('Image session capabilities incorrect');
          }
          const requests = await fetch(`${base}/api/requests`, {
            headers: { Cookie: cookie },
          });
          if (requests.status !== 200 ||
              !Array.isArray((await requests.json()).items)) {
            throw new Error('Image request list failed');
          }
          NODE
              docker stop negev-user-ci
              exit 0
            fi
            sleep 1
          done
          docker logs negev-user-ci
          docker stop negev-user-ci
          exit 1
      - run: |
          media_root="$(mktemp -d)"
          trap 'rm -rf "$media_root"' EXIT
          mkdir -p "$media_root/holding" "$media_root/import"
          chmod 755 "$media_root" "$media_root/holding" "$media_root/import"
          docker run --rm --network none \
            --mount "type=bind,src=$media_root,dst=/fixture,readonly" \
            --entrypoint node negev-user-test:ci --input-type=module -e '
              import { verifyHandoffMountRoots as verify } from "./src/acquisition/handoff-mount-roots.mjs";
              const bound = await verify({ holdingRoot: "/fixture/holding", importRoot: "/fixture/import" });
              if (bound.state !== "mounted_handoff_roots") throw Error("Parent bind was not accepted");
              const overlay = await verify({ holdingRoot: "/app/src", importRoot: "/app" });
              if (overlay.reason !== "handoff_mount_unavailable") throw Error("Container root was accepted");
            '
          docker run --rm --network none \
            --mount "type=bind,src=$media_root/holding,dst=/holding,readonly" \
            --mount "type=bind,src=$media_root/import,dst=/import,readonly" \
            --entrypoint node negev-user-test:ci --input-type=module -e '
              import { verifyHandoffMountRoots as verify } from "./src/acquisition/handoff-mount-roots.mjs";
              const separate = await verify({ holdingRoot: "/holding", importRoot: "/import" });
              if (separate.reason !== "handoff_mount_unavailable") throw Error("Separate binds were accepted");
            '
      - name: Verify socket-free acquisition roots in the built image
        run: |
          media_root="$(mktemp -d)"
          trap 'sudo rm -rf "$media_root"' EXIT
          mkdir -p "$media_root/staging" "$media_root/handoff/holding" "$media_root/handoff/source"
          chmod 0755 "$media_root"
          sudo chown -R 1000:1000 "$media_root"
          docker run --rm -i --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$media_root/staging,dst=/staging,readonly" \
            --mount "type=bind,src=$media_root/handoff,dst=/handoff" \
            --entrypoint node negev-user-test:ci --input-type=module - <<'NODE'
          import { ensureImportChild } from './src/acquisition/ensure-import-child.mjs';
          import { verifyLocalStagingRoot } from './src/acquisition/local-staging-root.mjs';
          const holdingRoot = '/handoff/holding';
          const importRoot = '/handoff/source/Negev';
          const ready = await ensureImportChild({ holdingRoot, importRoot });
          if (ready.state !== 'import_child_ready') throw Error('Import child was not prepared');
          const staging = await verifyLocalStagingRoot({
            stagingRoot: '/staging', holdingRoot, importRoot });
          if (staging.state !== 'verified_staging_root') throw Error('Staging root was not verified');
          NODE
          test -d "$media_root/handoff/source/Negev"
