name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: node --test

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --tag negev-private-test:ci .
      - run: |
          docker run --detach --name negev-private-ci --network none \
            --tmpfs /data:rw,mode=0700,uid=1000,gid=1000 \
            --env NEGEV_PRIVATE_TEST=1 \
            --env NEGEV_SHOKO_URL=http://shoko.invalid:8111 \
            --env NEGEV_SHOKO_API_KEY=synthetic-key \
            --env NEGEV_TEST_TOKEN=synthetic-private-token \
            --env NEGEV_DATA_DIR=/data negev-private-test:ci
          for attempt in 1 2 3 4 5; do
            if docker exec negev-private-ci node -e "fetch('http://127.0.0.1:3000/health/live').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"; then
              docker stop negev-private-ci
              exit 0
            fi
            sleep 1
          done
          docker logs negev-private-ci
          docker stop negev-private-ci
          exit 1
