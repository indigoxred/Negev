name: Publish versioned Negev image

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.RELEASE_TAG; if (!/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(tag) || tag !== 'v'+v) process.exit(1)"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test tagged source
        run: |
          pnpm install --frozen-lockfile
          node --test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/indigoxred/negev:${{ github.ref_name }}
            ghcr.io/indigoxred/negev:latest
